<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="65K lines of Rust in a 12-crate trading engine. 797 tests green. 97.9M frames captured over 14 days with 0 missing. Paper versus backtest P&amp;L difference 0.00000000. 38.3 ns order-book cancel, about 5 times faster than the std::map design.">
  <defs>
    <linearGradient id="gBlue" x1="0" x2="1"><stop offset="0" stop-color="#79c0ff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
    <linearGradient id="gGreen" x1="0" x2="1"><stop offset="0" stop-color="#7ee787"/><stop offset="1" stop-color="#3fb950"/></linearGradient>
    <linearGradient id="gPurple" x1="0" x2="1"><stop offset="0" stop-color="#d2a8ff"/><stop offset="1" stop-color="#a371f7"/></linearGradient>
    <linearGradient id="gAmber" x1="0" x2="1"><stop offset="0" stop-color="#f2cc60"/><stop offset="1" stop-color="#d29922"/></linearGradient>
    <linearGradient id="gRed" x1="0" x2="1"><stop offset="0" stop-color="#ffa198"/><stop offset="1" stop-color="#f85149"/></linearGradient>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .tile{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .t2{animation-delay:.12s}.t3{animation-delay:.24s}.t4{animation-delay:.36s}.t5{animation-delay:.48s}
    .sheen{animation:sheen 6s ease-in-out infinite}
    @keyframes sheen{0%,70%{opacity:0}80%{opacity:.9}100%{opacity:0}}
  </style>

  <g class="tile">
    <rect x="1" y="1" width="222" height="146" rx="16" fill="#0d1117" stroke="#30363d"/>
    <rect x="22" y="1" width="60" height="3" rx="1.5" fill="#58a6ff"/>
    <text x="22" y="62" class="sans" font-size="38" font-weight="800" fill="url(#gBlue)">~65K</text>
    <text x="22" y="94" class="sans" font-size="15" font-weight="600" fill="#e6edf3">lines of Rust</text>
    <text x="22" y="118" class="sans" font-size="13" fill="#8b949e">12-crate trading engine</text>
  </g>
  <g class="tile t2">
    <rect x="245" y="1" width="222" height="146" rx="16" fill="#0d1117" stroke="#30363d"/>
    <rect x="266" y="1" width="60" height="3" rx="1.5" fill="#3fb950"/>
    <text x="266" y="62" class="sans" font-size="38" font-weight="800" fill="url(#gGreen)">797</text>
    <text x="266" y="94" class="sans" font-size="15" font-weight="600" fill="#e6edf3">tests green</text>
    <text x="266" y="118" class="sans" font-size="13" fill="#8b949e">debug + release, clippy clean</text>
  </g>
  <g class="tile t3">
    <rect x="489" y="1" width="222" height="146" rx="16" fill="#0d1117" stroke="#30363d"/>
    <rect x="510" y="1" width="60" height="3" rx="1.5" fill="#a371f7"/>
    <text x="510" y="62" class="sans" font-size="38" font-weight="800" fill="url(#gPurple)">97.9M</text>
    <text x="510" y="94" class="sans" font-size="15" font-weight="600" fill="#e6edf3">frames captured</text>
    <text x="510" y="118" class="sans" font-size="13" fill="#8b949e">14 days live · 0 missing</text>
  </g>
  <g class="tile t4">
    <rect x="733" y="1" width="222" height="146" rx="16" fill="#0d1117" stroke="#30363d"/>
    <rect x="754" y="1" width="60" height="3" rx="1.5" fill="#d29922"/>
    <text x="754" y="60" class="mono" font-size="25" font-weight="800" fill="url(#gAmber)">Δ 0.00000000</text>
    <text x="754" y="94" class="sans" font-size="15" font-weight="600" fill="#e6edf3">paper vs backtest P&amp;L</text>
    <text x="754" y="118" class="sans" font-size="13" fill="#8b949e">matched to the satoshi</text>
  </g>
  <g class="tile t5">
    <rect x="977" y="1" width="222" height="146" rx="16" fill="#0d1117" stroke="#30363d"/>
    <rect x="998" y="1" width="60" height="3" rx="1.5" fill="#f85149"/>
    <text x="998" y="62" class="sans" font-size="38" font-weight="800" fill="url(#gRed)">38.3<tspan font-size="22" dx="4">ns</tspan></text>
    <text x="998" y="94" class="sans" font-size="15" font-weight="600" fill="#e6edf3">order-book cancel</text>
    <text x="998" y="118" class="sans" font-size="13" fill="#8b949e">5× faster than std::map</text>
  </g>
</svg>
