<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="DevOps on real AWS: git push, lint and tests, SAST and dependency scanning, secret scanning, a Trivy gate, images to GHCR, Helm test on kind, a GitOps bump, Argo CD sync, and EKS. Terraform provisions kind locally or EKS on AWS.">
