<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="web-automation-agent: a browser agent that looks at screenshots, has a vision LLM decide where to click and type, and drives Chromium with Playwright. No hard-coded selectors.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b0f19"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .hand{font-family:'Segoe Print','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive}

    .focus{opacity:0}
    .f1{animation:f1 8s steps(1) infinite}.f2{animation:f2 8s steps(1) infinite}
    @keyframes f1{0%{opacity:0}16%{opacity:1}46%{opacity:0}}
    @keyframes f2{0%{opacity:0}46%{opacity:1}78%{opacity:0}}
    .hl{fill:#58a6ff;fill-opacity:0;stroke:#30363d}
    .dot{fill:#30363d}.num{fill:#c9d1d9}.lbl{fill:#8b949e}
    .step .hl{animation:hl 2s infinite}.step .lbl{animation:lbl 2s infinite}.step .dot{animation:dot 2s infinite}
    .s1 *{animation-delay:.5s !important}.s2 *{animation-delay:1s !important}.s3 *{animation-delay:1.5s !important}
    @keyframes hl{0%,30%{fill-opacity:.16;stroke:#388bfd}31%,100%{fill-opacity:0;stroke:#30363d}}
    @keyframes lbl{0%,30%{fill:#e6edf3}31%,100%{fill:#8b949e}}
    @keyframes dot{0%,30%{fill:#1f6feb}31%,100%{fill:#30363d}}
  </style>
  <rect x="0.5" y="0.5" width="599" height="339" rx="18" fill="url(#bg)" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="599" height="339" rx="18" fill="url(#glow)"/>
  <rect x="28" y="0.5" width="64" height="3" rx="1.5" fill="#58a6ff"/>
  <text x="28" y="50" class="sans" font-size="24" font-weight="800" fill="#e6edf3">web-automation-agent</text>
  <rect x="408" y="30" width="164" height="26" rx="13" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.5"/>
  <text x="490.0" y="47.5" class="mono" font-size="12" font-weight="600" fill="#58a6ff" text-anchor="middle">Python · Playwright</text>
  <text x="28" y="77" class="sans" font-size="14.5" fill="#8b949e">A browser agent that reads screenshots, not CSS selectors.</text>

  <defs>
    <clipPath id="t1"><rect x="56" y="150" height="26" width="0">
      <animate attributeName="width" values="0;0;120;120;0" keyTimes="0;0.18;0.34;0.95;1" dur="8s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t2"><rect x="56" y="204" height="26" width="0">
      <animate attributeName="width" values="0;0;210;210;0" keyTimes="0;0.48;0.7;0.95;1" dur="8s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>
  <rect x="30" y="100" width="356" height="182" rx="10" fill="#000" fill-opacity="0.35"/>
  <rect x="28" y="96" width="356" height="182" rx="10" fill="#ffffff"/>
  <path d="M28 106 a10 10 0 0 1 10 -10 h336 a10 10 0 0 1 10 10 v18 h-356z" fill="#eaeef2"/>
  <circle cx="42" cy="110" r="4" fill="#ff5f57"/><circle cx="55" cy="110" r="4" fill="#febc2e"/><circle cx="68" cy="110" r="4" fill="#28c840"/>
  <rect x="84" y="102" width="220" height="16" rx="8" fill="#ffffff"/>
  <text x="96" y="114" class="mono" font-size="10.5" fill="#57606a">ui.shadcn.com/docs/forms</text>
  <g class="sans">
    <text x="48" y="146" font-size="12" font-weight="700" fill="#1f2328">Name</text>
    <rect x="48" y="152" width="318" height="26" rx="6" fill="#fff" stroke="#d0d7de"/>
    <rect x="48" y="152" width="318" height="26" rx="6" fill="none" stroke="#0969da" stroke-width="2" class="focus f1"/>
    <text x="58" y="170" font-size="13" fill="#1f2328" clip-path="url(#t1)">Ada Lovelace</text>
    <text x="48" y="200" font-size="12" font-weight="700" fill="#1f2328">Description</text>
    <rect x="48" y="206" width="318" height="26" rx="6" fill="#fff" stroke="#d0d7de"/>
    <rect x="48" y="206" width="318" height="26" rx="6" fill="none" stroke="#0969da" stroke-width="2" class="focus f2"/>
    <text x="58" y="224" font-size="13" fill="#1f2328" clip-path="url(#t2)">Wrote the first program.</text>
    <rect x="48" y="244" width="70" height="24" rx="6" fill="#1f2328"/>
    <text x="83" y="260" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Submit</text>
  </g>
  <g>
    <circle cx="0" cy="0" r="0" fill="none" stroke="#0969da" stroke-width="2">
      <animate attributeName="r" values="0;0;16;16;0;0;16;16;0;0;16;16" keyTimes="0;0.16;0.21;0.21;0.21;0.46;0.51;0.51;0.51;0.78;0.83;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0;0;0.9;0;0;0.9;0;0" keyTimes="0;0.16;0.21;0.46;0.46;0.51;0.78;0.78;0.83;1" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="210 165;210 165;210 165;210 219;210 219;84 256;84 256" keyTimes="0;0.16;0.4;0.46;0.7;0.78;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <g>
      <path d="M0 0 L0 17 L4.6 12.6 L7.8 19.4 L10.6 18.2 L7.4 11.6 L13 11.4 Z" fill="#1f2328" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
      <animateTransform attributeName="transform" type="translate" values="330 262;210 165;210 165;210 219;210 219;84 256;84 256;330 262" keyTimes="0;0.15;0.4;0.46;0.7;0.78;0.88;1" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>
  <text x="404" y="112" class="mono" font-size="11" letter-spacing="1.2" fill="#6e7681">AGENT LOOP</text>
  <g class="sans" font-size="13.5">
    <g class="step s0"><rect x="402" y="124" width="170" height="30" rx="8" class="hl"/><circle cx="420" cy="139" r="9" class="dot"/><text x="420" y="143.5" class="mono num" font-size="11" text-anchor="middle">1</text><text x="438" y="144" class="lbl">screenshot</text></g>
    <g class="step s1"><rect x="402" y="160" width="170" height="30" rx="8" class="hl"/><circle cx="420" cy="175" r="9" class="dot"/><text x="420" y="179.5" class="mono num" font-size="11" text-anchor="middle">2</text><text x="438" y="180" class="lbl">vision LLM decides</text></g>
    <g class="step s2"><rect x="402" y="196" width="170" height="30" rx="8" class="hl"/><circle cx="420" cy="211" r="9" class="dot"/><text x="420" y="215.5" class="mono num" font-size="11" text-anchor="middle">3</text><text x="438" y="216" class="lbl">click (x, y)</text></g>
    <g class="step s3"><rect x="402" y="232" width="170" height="30" rx="8" class="hl"/><circle cx="420" cy="247" r="9" class="dot"/><text x="420" y="251.5" class="mono num" font-size="11" text-anchor="middle">4</text><text x="438" y="252" class="lbl">type keys</text></g>
  </g>
  <text x="404" y="280" class="mono" font-size="10.5" fill="#6e7681">no hard-coded selectors</text>
  <line x1="28" y1="294" x2="572" y2="294" stroke="#21262d"/>
  <text x="28" y="320" class="mono" font-size="12" fill="#8b949e">Llama 4 <tspan fill="#79c0ff">vision</tspan> on Groq · coordinate-based tools · live web UI + CLI</text>
</svg>
