<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="quant architecture: HistoricalSource or LiveSource feed one Engine and Strategy, every order passes a mandatory RiskLayer, then a SimulatedVenue or LiveVenue. Backtest is historical plus simulated, paper is live plus simulated, live is live plus live. In the 14-day M5 paper run, paper and backtest matched exactly on both symbols: BTCUSDT 824 fills, cash 31.64743842, realized +0.7312598; ETHUSDT 822 fills, cash 97.65757574, realized -0.1335.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="420" rx="20"/></clipPath>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .m{opacity:0;animation:mode 12s infinite}
    .m2{animation-delay:4s}.m3{animation-delay:8s}
    @keyframes mode{0%{opacity:0}3%{opacity:1}30%{opacity:1}33.3%{opacity:0}100%{opacity:0}}
    .row{opacity:0;animation:row .5s ease-out forwards}
    @keyframes row{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
    .a1{animation-delay:.3s}.a2{animation-delay:.45s}.a3{animation-delay:.6s}.a4{animation-delay:.75s}
    .a5{animation-delay:.95s}.a6{animation-delay:1.1s}.a7{animation-delay:1.25s}.a8{animation-delay:1.4s}.a9{animation-delay:1.8s}
    .ok{animation:ok 3s ease-in-out infinite}
    @keyframes ok{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="20" fill="none" stroke="#30363d"/>

  <text x="24" y="44" class="mono" font-size="12.5" letter-spacing="1.5" fill="#8b949e">ONE STRATEGY BINARY · THREE WORLDS · NO CODE CHANGES</text>

  <!-- base edges -->
  <g fill="none" stroke="#30363d" stroke-width="2">
    <path d="M200 122 C231 122 231 222 262 222"/>
    <path d="M200 322 C231 322 231 222 262 222"/>
    <path d="M412 222 L462 222"/>
    <path d="M622 222 C647 222 647 122 672 122"/>
    <path d="M622 222 C647 222 647 322 672 322" stroke-dasharray="5 5"/>
    <path d="M337 128 L337 190"/>
  </g>
  <!-- strategy <-> engine, always on -->
  <circle r="3.5" fill="#8b949e"><animateMotion dur="1.6s" repeatCount="indefinite" path="M332 190 L332 128"/></circle>
  <circle r="3.5" fill="#8b949e"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M342 128 L342 190"/></circle>

  <!-- nodes -->
  <g class="sans">
    <rect x="24" y="90" width="176" height="64" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="117" font-size="16" font-weight="700" fill="#e6edf3">HistoricalSource</text>
    <text x="40" y="139" class="mono" font-size="12" fill="#8b949e">Parquet replay</text>

    <rect x="24" y="290" width="176" height="64" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="317" font-size="16" font-weight="700" fill="#e6edf3">LiveSource</text>
    <text x="40" y="339" class="mono" font-size="12" fill="#8b949e">Binance WebSocket</text>

    <rect x="262" y="70" width="150" height="58" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="278" y="95" font-size="16" font-weight="700" fill="#e6edf3">Strategy</text>
    <text x="278" y="115" class="mono" font-size="11.5" fill="#8b949e">can't tell which</text>

    <rect x="262" y="190" width="150" height="64" rx="12" fill="#1f6feb" fill-opacity="0.12" stroke="#388bfd"/>
    <text x="278" y="217" font-size="17" font-weight="800" fill="#e6edf3">Engine</text>
    <text x="278" y="239" class="mono" font-size="11.5" fill="#79c0ff">recv-time only</text>

    <rect x="462" y="190" width="160" height="64" rx="12" fill="#f85149" fill-opacity="0.08" stroke="#f85149" stroke-opacity="0.6"/>
    <text x="478" y="217" font-size="16" font-weight="700" fill="#e6edf3">RiskLayer</text>
    <text x="478" y="239" class="mono" font-size="11.5" fill="#ffa198">every order, no bypass</text>

    <rect x="672" y="90" width="170" height="64" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="688" y="117" font-size="16" font-weight="700" fill="#e6edf3">SimulatedVenue</text>
    <text x="688" y="139" class="mono" font-size="12" fill="#8b949e">fills · fees · latency</text>

    <rect x="672" y="290" width="170" height="64" rx="12" fill="#161b22" stroke="#6e7681" stroke-dasharray="5 4"/>
    <text x="688" y="317" font-size="16" font-weight="700" fill="#e6edf3">LiveVenue</text>
    <text x="688" y="339" class="mono" font-size="12" fill="#e3b341">real orders · M8</text>
  </g>

  <!-- mode 1: backtest -->
  <g class="m">
    <g fill="none" stroke="#58a6ff" stroke-width="3" filter="url(#glow)">
      <path d="M200 122 C231 122 231 222 262 222"/><path d="M412 222 L462 222"/><path d="M622 222 C647 222 647 122 672 122"/>
      <rect x="24" y="90" width="176" height="64" rx="12" stroke-width="2"/><rect x="672" y="90" width="170" height="64" rx="12" stroke-width="2"/>
    </g>
    <g fill="#79c0ff">
      <circle r="4.5"><animateMotion dur="1.2s" repeatCount="indefinite" path="M200 122 C231 122 231 222 262 222"/></circle>
      <circle r="4.5"><animateMotion dur="0.6s" repeatCount="indefinite" path="M412 222 L462 222"/></circle>
      <circle r="4.5"><animateMotion dur="1.2s" repeatCount="indefinite" path="M622 222 C647 222 647 122 672 122"/></circle>
    </g>
    <rect x="84" y="366" width="100" height="30" rx="15" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff"/>
    <text x="410" y="386" class="sans" font-size="15" fill="#c9d1d9">backtest = <tspan fill="#79c0ff" font-weight="700">historical</tspan> data → <tspan fill="#79c0ff" font-weight="700">simulated</tspan> venue</text>
  </g>
  <!-- mode 2: paper -->
  <g class="m m2">
    <g fill="none" stroke="#bc8cff" stroke-width="3" filter="url(#glow)">
      <path d="M200 322 C231 322 231 222 262 222"/><path d="M412 222 L462 222"/><path d="M622 222 C647 222 647 122 672 122"/>
      <rect x="24" y="290" width="176" height="64" rx="12" stroke-width="2"/><rect x="672" y="90" width="170" height="64" rx="12" stroke-width="2"/>
    </g>
    <g fill="#d2a8ff">
      <circle r="4.5"><animateMotion dur="1.2s" repeatCount="indefinite" path="M200 322 C231 322 231 222 262 222"/></circle>
      <circle r="4.5"><animateMotion dur="0.6s" repeatCount="indefinite" path="M412 222 L462 222"/></circle>
      <circle r="4.5"><animateMotion dur="1.2s" repeatCount="indefinite" path="M622 222 C647 222 647 122 672 122"/></circle>
    </g>
    <rect x="194" y="366" width="100" height="30" rx="15" fill="#bc8cff" fill-opacity="0.18" stroke="#bc8cff"/>
    <text x="410" y="386" class="sans" font-size="15" fill="#c9d1d9">paper = <tspan fill="#d2a8ff" font-weight="700">live</tspan> data → <tspan fill="#d2a8ff" font-weight="700">simulated</tspan> venue</text>
  </g>
  <!-- mode 3: live -->
  <g class="m m3">
    <g fill="none" stroke="#e3b341" stroke-width="3" filter="url(#glow)">
      <path d="M200 322 C231 322 231 222 262 222"/><path d="M412 222 L462 222"/><path d="M622 222 C647 222 647 322 672 322"/>
      <rect x="24" y="290" width="176" height="64" rx="12" stroke-width="2"/><rect x="672" y="290" width="170" height="64" rx="12" stroke-width="2"/>
    </g>
    <g fill="#f2cc60">
      <circle r="4.5"><animateMotion dur="1.2s" repeatCount="indefinite" path="M200 322 C231 322 231 222 262 222"/></circle>
      <circle r="4.5"><animateMotion dur="0.6s" repeatCount="indefinite" path="M412 222 L462 222"/></circle>
      <circle r="4.5"><animateMotion dur="1.2s" repeatCount="indefinite" path="M622 222 C647 222 647 322 672 322"/></circle>
    </g>
    <rect x="304" y="366" width="90" height="30" rx="15" fill="#e3b341" fill-opacity="0.18" stroke="#e3b341"/>
    <text x="410" y="386" class="sans" font-size="15" fill="#c9d1d9">live = <tspan fill="#f2cc60" font-weight="700">live</tspan> data → <tspan fill="#f2cc60" font-weight="700">real</tspan> orders <tspan fill="#8b949e">(in progress)</tspan></text>
  </g>

  <!-- mode chips -->
  <text x="24" y="386" class="mono" font-size="11.5" letter-spacing="1.5" fill="#6e7681">MODE</text>
  <g class="sans" font-size="14" font-weight="700" text-anchor="middle" fill="#c9d1d9">
    <rect x="84" y="366" width="100" height="30" rx="15" fill="none" stroke="#30363d"/><text x="134" y="386">backtest</text>
    <rect x="194" y="366" width="100" height="30" rx="15" fill="none" stroke="#30363d"/><text x="244" y="386">paper</text>
    <rect x="304" y="366" width="90" height="30" rx="15" fill="none" stroke="#30363d"/><text x="349" y="386">live</text>
  </g>

  <!-- M5 results panel -->
  <rect x="872" y="24" width="304" height="372" rx="14" fill="#0d1117" stroke="#30363d"/>
  <g class="row">
    <text x="892" y="56" class="sans" font-size="16" font-weight="800" fill="#e6edf3">M5 · 14-day paper run</text>
    <text x="892" y="77" class="mono" font-size="12" fill="#8b949e">2026-09-18 → 2026-10-02</text>
  </g>
  <g class="mono" font-size="12.5">
    <g class="row a1" fill="#6e7681" font-size="11" letter-spacing="1">
      <text x="1072" y="106" text-anchor="end">PAPER</text><text x="1158" y="106" text-anchor="end">BACKTEST</text>
    </g>
    <line x1="892" y1="114" x2="1158" y2="114" stroke="#21262d"/>
    <text x="892" y="136" class="row a2" font-weight="700" fill="#e6edf3">BTCUSDT</text>
    <g class="row a3"><text x="892" y="158" fill="#8b949e">fills</text><text x="1072" y="158" text-anchor="end" fill="#e6edf3">824</text><text x="1158" y="158" text-anchor="end" fill="#e6edf3">824</text></g>
    <g class="row a3"><text x="892" y="180" fill="#8b949e">cash</text><text x="1072" y="180" text-anchor="end" fill="#e6edf3">31.64743842</text><text x="1158" y="180" text-anchor="end" fill="#e6edf3">31.64743842</text></g>
    <g class="row a4"><text x="892" y="202" fill="#8b949e">realized</text><text x="1072" y="202" text-anchor="end" fill="#56d364">+0.7312598</text><text x="1158" y="202" text-anchor="end" fill="#56d364">+0.7312598</text></g>
    <text x="892" y="234" class="row a5" font-weight="700" fill="#e6edf3">ETHUSDT</text>
    <g class="row a6"><text x="892" y="256" fill="#8b949e">fills</text><text x="1072" y="256" text-anchor="end" fill="#e6edf3">822</text><text x="1158" y="256" text-anchor="end" fill="#e6edf3">822</text></g>
    <g class="row a7"><text x="892" y="278" fill="#8b949e">cash</text><text x="1072" y="278" text-anchor="end" fill="#e6edf3">97.65757574</text><text x="1158" y="278" text-anchor="end" fill="#e6edf3">97.65757574</text></g>
    <g class="row a8"><text x="892" y="300" fill="#8b949e">realized</text><text x="1072" y="300" text-anchor="end" fill="#ff7b72">−0.1335</text><text x="1158" y="300" text-anchor="end" fill="#ff7b72">−0.1335</text></g>
  </g>
  <g class="row a9">
    <rect x="892" y="316" width="266" height="36" rx="10" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" class="ok"/>
    <text x="1025" y="339" class="sans" font-size="14.5" font-weight="700" fill="#56d364" text-anchor="middle">✓ identical, to the satoshi</text>
    <text x="1025" y="378" class="mono" font-size="11" fill="#6e7681" text-anchor="middle">97,937,822 frames · missing 0</text>
  </g>
</svg>
