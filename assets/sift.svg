  <line x1="28" y1="294" x2="572" y2="294" stroke="#21262d"/>
  <text x="28" y="320" class="mono" font-size="12" fill="#8b949e">Celery <tspan fill="#d2a8ff">OCR + embeddings</tspan> pipeline · local ONNX · multi-tenant</text>
