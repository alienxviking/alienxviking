    <text x="256" y="215.5" class="mono" font-size="12" fill="#e6edf3">scan_0412.png</text>
  </g>
  <g class="res c2 k2">
    <rect x="214" y="230" width="172" height="26" rx="7" fill="#161b22" stroke="#30363d"/>
    <text x="226" y="247.5" class="mono" font-size="11.5" fill="#6e7681">3</text>
    <circle cx="244" cy="243" r="4" fill="#58a6ff"/>
    <text x="256" y="247.5" class="mono" font-size="12" fill="#e6edf3">msa_2024.pdf</text>
  </g>
  <path d="M392 211 l10 0 m-4 -5 l5 5 l-5 5" fill="none" stroke="#a371f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="res c2 k2"/>
  <g class="res c3 k0">
