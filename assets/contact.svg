<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Open to contract work: backend and systems, AI agents and RAG, cloud infrastructure. Email snehangshu.roy.mail@gmail.com">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#120c24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="230" rx="22"/></clipPath>
    <clipPath id="tape"><rect x="0" y="186" width="1200" height="44"/></clipPath>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .scroll{animation:scroll 30s linear infinite}
    @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-1200px)}}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="230" fill="url(#bg)"/>
    <rect width="1200" height="230" fill="url(#glow)"/>
    <rect y="186" width="1200" height="44" fill="#010409" fill-opacity="0.6"/>
    <line x1="0" y1="186" x2="1200" y2="186" stroke="#30363d"/>
    <g clip-path="url(#tape)">
      <g class="scroll mono" font-size="13" fill="#8b949e">
        <text x="20" y="213" xml:space="preserve"><tspan fill="#58a6ff">quant</tspan> 797 tests ▲     <tspan fill="#f85149">redpen</tspan> 102 tests ▲     <tspan fill="#3fb950">order book</tspan> 38.3 ns cancel ▼     <tspan fill="#a371f7">sift</tspan> RRF hybrid search     <tspan fill="#39c5cf">nexo</tspan> Redis pub/sub     <tspan fill="#e3b341">devops</tspan> EKS + Argo CD     </text>
        <text x="1220" y="213" xml:space="preserve"><tspan fill="#58a6ff">quant</tspan> 797 tests ▲     <tspan fill="#f85149">redpen</tspan> 102 tests ▲     <tspan fill="#3fb950">order book</tspan> 38.3 ns cancel ▼     <tspan fill="#a371f7">sift</tspan> RRF hybrid search     <tspan fill="#39c5cf">nexo</tspan> Redis pub/sub     <tspan fill="#e3b341">devops</tspan> EKS + Argo CD     </text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="229" rx="22" fill="none" stroke="#30363d"/>

  <circle cx="490" cy="44" r="5" fill="#3fb950" class="pulse"/>
  <text x="502" y="49" class="mono" font-size="13" fill="#56d364">open to contract work</text>
  <text x="600" y="98" class="sans" font-size="40" font-weight="800" letter-spacing="-0.8" fill="url(#head)" text-anchor="middle">Have something hard to build? Let's talk.</text>
  <text x="600" y="130" class="sans" font-size="17" fill="#8b949e" text-anchor="middle">backend &amp; systems  ·  AI agents &amp; RAG  ·  cloud infrastructure</text>
  <rect x="408" y="144" width="384" height="32" rx="16" fill="#1f6feb" fill-opacity="0.16" stroke="#388bfd"/>
