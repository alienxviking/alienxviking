<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="Limit order book in C++17, three designs benchmarked. Median add_order: std::map 113.4 ns, heap 71.2 ns, ours 56.7 ns. cancel_order: std::map 201.6 ns, heap 471.2 ns, ours 38.3 ns. 3.8 times faster overall, about 5 times fewer L1 misses, IPC 1.41 versus 0.79.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b0f19"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .hand{font-family:'Segoe Print','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive}

    .bar{transform-box:fill-box;transform-origin:0 50%;animation:grow 6s cubic-bezier(.2,.7,.2,1) infinite}
    .b1{animation-delay:.12s}.b2{animation-delay:.24s}
    @keyframes grow{0%{transform:scaleX(0)}18%,90%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
    .pop{opacity:0;animation:pop 6s ease-out infinite}
    @keyframes pop{0%,22%{opacity:0}28%,90%{opacity:1}97%,100%{opacity:0}}
  </style>
  <rect x="0.5" y="0.5" width="599" height="339" rx="18" fill="url(#bg)" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="599" height="339" rx="18" fill="url(#glow)"/>
  <rect x="28" y="0.5" width="64" height="3" rx="1.5" fill="#3fb950"/>
  <text x="28" y="50" class="sans" font-size="24" font-weight="800" fill="#e6edf3">Limit Order Book</text>
  <rect x="459" y="30" width="113" height="26" rx="13" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.5"/>
  <text x="515.5" y="47.5" class="mono" font-size="12" font-weight="600" fill="#3fb950" text-anchor="middle">C++17 · perf</text>
  <text x="28" y="77" class="sans" font-size="14.5" fill="#8b949e">Three designs, one benchmark, and hardware counters to explain the gap.</text>

  <text x="572" y="104" class="mono" font-size="11" fill="#6e7681" text-anchor="end">median ns / op · lower is better</text>
  <text x="28" y="114" class="mono" font-size="12.5" font-weight="700" fill="#c9d1d9">add_order</text>
    <text x="118" y="134.5" class="mono" font-size="12" fill="#8b949e" text-anchor="end">std::map</text>
    <rect x="128" y="122" width="79.4" height="16" rx="4" fill="#6e7681" class="bar b0"/>
    <text x="215.4" y="134.5" class="mono" font-size="12" fill="#8b949e">113.4 ns</text>
    <text x="118" y="156.5" class="mono" font-size="12" fill="#8b949e" text-anchor="end">heap</text>
    <rect x="128" y="144" width="49.9" height="16" rx="4" fill="#484f58" class="bar b1"/>
    <text x="185.9" y="156.5" class="mono" font-size="12" fill="#8b949e">71.2 ns</text>
    <text x="118" y="178.5" class="mono" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="700">ours</text>
    <rect x="128" y="166" width="39.7" height="16" rx="4" fill="#3fb950" class="bar b2" filter="url(#soft)"/>
    <text x="175.7" y="178.5" class="mono" font-size="12" fill="#56d364" font-weight="700">56.7 ns</text>
  <text x="28" y="204" class="mono" font-size="12.5" font-weight="700" fill="#c9d1d9">cancel_order</text>
    <text x="118" y="224.5" class="mono" font-size="12" fill="#8b949e" text-anchor="end">std::map</text>
    <rect x="128" y="212" width="141.2" height="16" rx="4" fill="#6e7681" class="bar b0"/>
    <text x="277.2" y="224.5" class="mono" font-size="12" fill="#8b949e">201.6 ns</text>
    <text x="118" y="246.5" class="mono" font-size="12" fill="#8b949e" text-anchor="end">heap</text>
    <rect x="128" y="234" width="330.0" height="16" rx="4" fill="#484f58" class="bar b1"/>
    <text x="466.0" y="246.5" class="mono" font-size="12" fill="#8b949e">471.2 ns</text>
    <text x="118" y="268.5" class="mono" font-size="12" fill="#e6edf3" text-anchor="end" font-weight="700">ours</text>
    <rect x="128" y="256" width="26.8" height="16" rx="4" fill="#3fb950" class="bar b2" filter="url(#soft)"/>
    <text x="162.8" y="268.5" class="mono" font-size="12" fill="#56d364" font-weight="700">38.3 ns</text>
  <g class="pop">
    <rect x="392" y="254" width="180" height="24" rx="12" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950"/>
    <text x="482" y="270.5" class="sans" font-size="12.5" font-weight="700" fill="#56d364" text-anchor="middle">cancel 5.3× faster</text>
  </g>
  <line x1="28" y1="294" x2="572" y2="294" stroke="#21262d"/>
  <text x="28" y="320" class="mono" font-size="12" fill="#8b949e"><tspan fill="#56d364">3.8×</tspan> faster overall · <tspan fill="#56d364">~5×</tspan> fewer L1 misses · IPC <tspan fill="#56d364">1.41</tspan> vs 0.79</text>
</svg>
